name: Creating Pipeline in etl 
on:
  push:
      branches: 
        -main

jobs:
  extract data:
   runs-on: ubuntu-latest
   steps: 
      - name : checkout code
        uses: actions/checkout@v2
      - name : run python file to extract data
        run : python extract.py             

  transform data:
   runs-on: ubuntu-latest
   needs: extract data
   steps:
      - name: checkout code
        uses: actions/checkout@v2 

      - name: transform data by runnig python
        run : python transform.py   

  load data :
    runs-on: ubuntu-latest
    needs : transform data
    steps : 
       - name : checkout code
         uses : actions/checkout@v2

       - name : laoding data to destination
         run  : python load.py              